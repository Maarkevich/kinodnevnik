name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Порядок важен: version.ts генерируется до любой проверки, которая его
      # импортирует (settings.page.ts), иначе линт и тесты падают на пустом месте.
      - name: Generate build version
        run: npm run prebuild

      - name: Typecheck app
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Typecheck service worker (WebWorker lib)
        run: >-
          npx tsc --noEmit --target ES2022 --module ES2022
          --lib ES2022,WebWorker --strict --moduleResolution bundler src/sw.ts

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify SW manifest and Russian-only UI
        run: node scripts/verify-build.mjs
